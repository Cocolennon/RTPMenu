# List of worlds to display in the RTP menu. There are 3 worlds per page
worlds:
  world: # The world's name. It can be found in your server's files, or in Multiverse's worlds list
    # You can use ItemsAdder items by changing this to itemsadder-namespace:itemname (example: itemsadder-customitems:coolstick)
    # Or you can use Nexo items by changing this to nexo-itemname (example: nexo-coolstick)
    item: grass_block
    name: "<#00C200>Overworld" # The item's display name. Doesn't matter if using an ItemsAdder item
    max-x: 50000 # Maximum X coordinate, both positive and negative (50000 means you can be teleported both to X 50000 and -50000)
    max-z: 50000 # Maximum Z coordinate, same explanation as above
    blacklisted-blocks: [lava, water, magma_block, fire, cactus, campfire] # List of blocks you can't be teleported on top of. Usually includes lava!
  world_nether:
    item: netherrack
    name: "<#BD0000>Nether"
    max-x: 15000
    max-z: 15000
    blacklisted-blocks: [lava, magma_block, fire, soul_fire, soul_campfire]
  world_the_end:
    item: end_stone
    name: "<#DB3BFF>The End"
    max-x: 50000
    max-z: 50000
    blacklisted-blocks: [obsidian]